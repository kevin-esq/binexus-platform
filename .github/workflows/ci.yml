name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # Required: sdk + web
  frontend:
    name: Frontend (sdk + web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec turbo run typecheck

      - name: Lint
        run: pnpm exec turbo run lint

      - name: Prettier check
        run: pnpm format:check

      - name: Test (sdk + packages)
        run: pnpm exec turbo run test

      - name: Build
        run: pnpm exec turbo run build

  # Required: .NET modular monolith
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      Jwt__SigningKey: ci-only-binexus-signing-key-with-more-than-32-bytes
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet vulnerable audit
        working-directory: apps/backend
        run: |
          dotnet restore
          dotnet package list --file Binexus.slnx --vulnerable --include-transitive
          json="$(dotnet package list --file Binexus.slnx --vulnerable --include-transitive --format json)"
          echo "$json"
          high_or_critical="$(echo "$json" | jq -r '
            [.. | objects | select(has("vulnerabilities")) | .vulnerabilities[]?
             | select(.severity == "High" or .severity == "Critical")
            ] | length')"
          exceptions="$(jq -r 'length' ../../docs/migration/nuget-audit-exceptions.json)"
          if [ "$exceptions" != "0" ]; then
            jq -e 'all(.[]; (.reviewBy // .ReviewBy // "") != "" and (.removalCondition // .RemovalCondition // "") != "")' ../../docs/migration/nuget-audit-exceptions.json
          fi
          if [ "$high_or_critical" != "0" ]; then
            echo "::error::Found $high_or_critical unapproved High/Critical vulnerabilities"
            exit 1
          fi

      - name: Format verify
        working-directory: apps/backend
        run: dotnet format Binexus.slnx --verify-no-changes --severity warn

      - name: Build
        working-directory: apps/backend
        run: dotnet build --configuration Release --no-restore

      - name: EF pending model changes
        working-directory: apps/backend
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/Binexus.Platform/Binexus.Platform.csproj \
            --startup-project src/Binexus.Api/Binexus.Api.csproj

      - name: Generate idempotent SQL
        working-directory: apps/backend
        run: |
          mkdir -p db ../../artifacts/migrations
          dotnet ef migrations script --idempotent \
            --project src/Binexus.Platform/Binexus.Platform.csproj \
            --startup-project src/Binexus.Api/Binexus.Api.csproj \
            -o db/binexus-idempotent.sql
          cp db/binexus-idempotent.sql ../../artifacts/migrations/binexus-idempotent.sql

      - name: Upload idempotent SQL
        uses: actions/upload-artifact@v4
        with:
          name: binexus-idempotent-sql
          path: |
            apps/backend/db/binexus-idempotent.sql
            artifacts/migrations/binexus-idempotent.sql

      - name: Test
        working-directory: apps/backend
        run: dotnet test --configuration Release --no-build

      - name: Verify OpenAPI artifact
        run: test -f artifacts/openapi/binexus-v1.json

      - name: Generate TypeScript SDK
        shell: pwsh
        run: ./apps/backend/scripts/generate-sdk.ps1

      - name: Verify generated SDK is committed
        run: git diff --exit-code packages/sdk/src/generated/schema.d.ts

  # Required: compose stack + SMOKE_REQUIRE=1 (MinIO) + Playwright when feasible
  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      Jwt__SigningKey: ci-only-binexus-signing-key-with-more-than-32-bytes
      IdentitySeed__AdminPassword: ChangeMe123!
      Logistics__Storage__Provider: MinIO
      Logistics__Storage__Endpoint: http://minio:9000
      Logistics__Storage__InternalEndpoint: http://minio:9000
      Logistics__Storage__PublicEndpoint: http://localhost:9000
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      RUN_MIGRATIONS: '0'
      COMPOSE_PROJECT_NAME: binexus-ci-smoke
      # Use standard ports on clean CI runners so Playwright can share the stack.
      API_SMOKE_PORT: '5102'
      WORKERS_SMOKE_PORT: '5103'
      MINIO_SMOKE_PORT: '9000'
      MINIO_CONSOLE_SMOKE_PORT: '9001'
      POSTGRES_SMOKE_PORT: '5432'
      SMOKE_API_URL: http://localhost:5102
      SMOKE_WORKERS_URL: http://localhost:5103
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NEXT_PUBLIC_API_URL: http://localhost:5102
      PLAYWRIGHT_API_URL: http://localhost:5102
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compose config (validate)
        run: |
          docker compose -f infrastructure/compose/docker-compose.yml config --services
          docker compose -f infrastructure/compose/docker-compose.yml config >/dev/null

      - name: Compose smoke (SMOKE_REQUIRE=1, MinIO)
        run: bash apps/backend/scripts/gate6-compose-smoke.sh
        env:
          KEEP_RUNNING: '1'

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright gate5 smoke (Next webServer → .NET API)
        working-directory: apps/web
        run: pnpm exec playwright test e2e/gate5-smoke.spec.ts
        env:
          CI: 'true'
          NEXT_PUBLIC_API_URL: http://localhost:5102
          PLAYWRIGHT_API_URL: http://localhost:5102

      - name: Upload smoke / compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate6-smoke-logs
          path: |
            artifacts/gate6-smoke/
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore

      - name: Compose down
        if: always()
        run: docker compose -f infrastructure/compose/docker-compose.yml -p binexus-ci-smoke --profile web --profile seed down --remove-orphans -v || true

  ci-summary:
    name: CI Summary
    if: always()
    needs: [frontend, backend, compose-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        run: |
          status_frontend="${{ needs.frontend.result }}"
          status_backend="${{ needs.backend.result }}"
          status_smoke="${{ needs.compose-smoke.result }}"
          echo "frontend=$status_frontend"
          echo "backend=$status_backend"
          echo "compose-smoke=$status_smoke"
          if [[ "$status_frontend" != "success" || \
                "$status_backend" != "success" || \
                "$status_smoke" != "success" ]]; then
            echo "::error::One or more required CI checks failed"
            exit 1
          fi
          echo "All required checks passed"
