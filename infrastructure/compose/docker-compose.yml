# Binexus .NET local stack (Gate 7+)
# From repo root:
#   docker compose -f infrastructure/compose/docker-compose.yml --env-file .env up -d --build
# Optional web: add --profile web
# Optional seed one-shot: add --profile seed
#
# Production: run migrate job once → then deploy api + workers. Never migrate on every API replica.

name: binexus

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
  # Always the compose service hostname (do not use localhost from host .env).
  Database__ConnectionString: Host=postgres;Port=5432;Database=binexus;Username=binexus;Password=binexus
  Jwt__SigningKey: ${Jwt__SigningKey:?Jwt__SigningKey required}
  Jwt__Issuer: ${Jwt__Issuer:-binexus}
  Jwt__Audience: ${Jwt__Audience:-binexus-api}
  Jwt__AccessTokenLifetime: ${Jwt__AccessTokenLifetime:-00:15:00}
  Jwt__RefreshTokenLifetime: ${Jwt__RefreshTokenLifetime:-7.00:00:00}
  Jwt__ClockSkew: ${Jwt__ClockSkew:-00:00:30}
  IdentitySeed__AdminPassword: ${IdentitySeed__AdminPassword:-ChangeMe123!}
  IdentitySeed__TenantSlug: ${IdentitySeed__TenantSlug:-acme}
  IdentitySeed__AdminEmail: ${IdentitySeed__AdminEmail:-admin@acme.test}
  Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-http://localhost:3000}
  Features__LiquidationKillSwitch: ${Features__LiquidationKillSwitch:-true}
  # MinIO with split endpoints: S3 ops via docker DNS; browser presign via localhost.
  Logistics__Storage__Provider: ${Logistics__Storage__Provider:-MinIO}
  Logistics__Storage__Endpoint: ${Logistics__Storage__Endpoint:-http://minio:9000}
  Logistics__Storage__InternalEndpoint: ${Logistics__Storage__InternalEndpoint:-http://minio:9000}
  Logistics__Storage__PublicEndpoint: ${Logistics__Storage__PublicEndpoint:-http://localhost:9000}
  Logistics__Storage__Bucket: ${Logistics__Storage__Bucket:-binexus-dev}
  Logistics__Storage__AccessKey: ${Logistics__Storage__AccessKey:-binexus}
  Logistics__Storage__SecretKey: ${Logistics__Storage__SecretKey:-binexus123}
  Logistics__Storage__Region: ${Logistics__Storage__Region:-us-east-1}

services:
  postgres:
    image: postgres:16-alpine
    container_name: binexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: binexus
      POSTGRES_PASSWORD: binexus
      POSTGRES_DB: binexus
    ports:
      - '${BINEXUS_POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U binexus -d binexus']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Pin release; do not use :latest.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: binexus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: binexus
      MINIO_ROOT_PASSWORD: binexus123
      # Community MinIO: cluster-wide CORS (bucket-level mc cors is AIStor).
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:3000'
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '${BINEXUS_MINIO_HOST_PORT:-9000}:9000'
      - '${BINEXUS_MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-bucket-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: binexus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 binexus binexus123 &&
        mc mb --ignore-existing local/binexus-dev
      "

  # One-shot EF migrator (efbundle). Exits 0 when schema is up to date. Re-runs are idempotent.
  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    image: binexus-api:local
    container_name: binexus-migrate
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=binexus;Username=binexus;Password=binexus
      Jwt__SigningKey: ${Jwt__SigningKey:?Jwt__SigningKey required}
    entrypoint: ['/app/efbundle']
    command:
      - '--connection'
      - 'Host=postgres;Port=5432;Database=binexus;Username=binexus;Password=binexus'

  # Optional Development seed one-shot (profile seed). Production must not register demo seed.
  seed:
    profiles: ['seed']
    image: binexus-api:local
    container_name: binexus-seed
    restart: 'no'
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *dotnet-env
      RUN_MIGRATIONS: '0'
      SEED_ON_START: '0'
    entrypoint: ['dotnet', 'Binexus.Api.dll', '--seed']

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    image: binexus-api:local
    container_name: binexus-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-bucket-init:
        condition: service_completed_successfully
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:8080
      # Migrations run in the dedicated migrate service — never on every API replica.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
    ports:
      - '${BINEXUS_API_HOST_PORT:-5102}:8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  workers:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.workers
    image: binexus-workers:local
    container_name: binexus-workers
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: http://+:8081
      RUN_MIGRATIONS: '0'
    ports:
      - '${BINEXUS_WORKERS_HOST_PORT:-5103}:8081'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8081/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    profiles: ['web']
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5102}
    image: binexus-web:local
    container_name: binexus-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5102}
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  minio_data:
