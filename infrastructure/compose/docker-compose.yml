name: binexus

services:
  postgres:
    image: postgres:16-alpine
    container_name: binexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: binexus
      POSTGRES_PASSWORD: binexus
      POSTGRES_DB: binexus
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U binexus -d binexus']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: binexus-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: binexus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: binexus
      MINIO_ROOT_PASSWORD: binexus123
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-bucket-init:
    image: minio/mc:latest
    container_name: binexus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 binexus binexus123 &&
        mc mb --ignore-existing local/binexus-dev &&
        mc anonymous set download local/binexus-dev || true
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
