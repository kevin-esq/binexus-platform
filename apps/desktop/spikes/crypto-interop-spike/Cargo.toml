[package]
name = "crypto-interop-spike"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "crypto-interop-spike"
path = "src/main.rs"

[dependencies]
p256 = { version = "=0.13.2", features = ["ecdsa"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
hex = "=0.4.3"
