[package]
name = "secure-storage-spike"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "secure-storage-spike"
path = "src/main.rs"

[dependencies]
keyring = { version = "=3.6.2", features = ["windows-native"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
base64 = "=0.22.1"
rand = "=0.8.5"
thiserror = "=2.0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.1", features = ["Win32_Security_Cryptography"] }
