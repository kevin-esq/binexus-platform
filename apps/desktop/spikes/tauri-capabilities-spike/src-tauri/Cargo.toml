[workspace]

[package]
name = "tauri-capabilities-spike"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "tauri_capabilities_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
