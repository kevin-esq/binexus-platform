[package]
name = "binexus-desktop"
version = "0.1.0"
description = "Binexus Branch Client (Tauri 2)"
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "binexus_desktop_lib"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "binexus-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "=2.0.12"
uuid = { version = "=1.16.0", features = ["v7", "serde"] }
chrono = { version = "=0.4.41", features = ["serde"] }
keyring = { version = "=3.6.2", features = ["windows-native"] }
p256 = { version = "=0.13.2", features = ["ecdsa"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
hex = "=0.4.3"
rand = "=0.8.5"
reqwest = { version = "=0.12.22", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "=1.45.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
fs2 = "=0.4.3"
url = "=2.5.4"
parking_lot = "=0.12.4"
tracing = "=0.1.41"

[dev-dependencies]
tempfile = "=3.20.0"
wiremock = "=0.6.4"
tokio = { version = "=1.45.1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
