[package]
name = "binexus-desktop"
version = "0.0.0"
description = "Binexus desktop shell (Tauri 2). Phase 0 scaffold."
edition = "2021"
rust-version = "1.77"

[lib]
name = "binexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
